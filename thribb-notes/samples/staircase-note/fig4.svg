<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><rect width="480" height="360" fill="#000"/><style>text{font-family:Georgia,serif;fill:#fff;font-size:28px}</style><text x="240.0" y="70" text-anchor="middle" style="fill:#FFD84D">n rows, n + 1 columns</text><text x="240.0" y="130" text-anchor="middle" style="fill:#fff">row k: k + (n + 1 - k) = n + 1</text><text x="240.0" y="190" text-anchor="middle" style="fill:#fff">2 x (1 + 2 + ... + n) = n (n + 1)</text><text x="240.0" y="250" text-anchor="middle" style="fill:#FFD84D">1 + 2 + ... + n = n (n + 1) / 2</text><text x="240.0" y="310" text-anchor="middle" style="fill:#58C4DD">check n = 4: 4 x 5 / 2 = 10</text></svg>